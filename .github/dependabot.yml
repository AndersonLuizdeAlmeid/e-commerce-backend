# Atualizações semanais de dependências (arquivo 17 §1, entrega 6.2). Minor e patch vêm juntos num PR por ecossistema;
# major vem separado. Ações do GitHub continuam fixadas por SHA: o Dependabot troca o SHA e o comentário da versão.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    # Pacotes da Microsoft acompanham o .NET da solução (global.json). A versão maior vem com o .NET novo: o 11 do
    # HybridCache trouxe um segundo gerador de log e quebrou o build (20/11/2026).
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    # A imagem do SDK e do runtime segue o global.json; a troca de versão maior do .NET é decisão, não atualização.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
