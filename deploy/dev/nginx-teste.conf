# Ambiente de testes da equipe pelo nginx da VM (README, "Ambiente de testes da equipe").
# Instalar em /etc/nginx/sites-available/mo-teste, ligar em sites-enabled e emitir os certificados com:
#   certbot --nginx -d loja-teste.contrax.one -d api-loja-teste.contrax.one
# O certbot acrescenta o bloco 443 e o redirecionamento de http para https.
#
# Depois do certbot, troque cada "listen 443 ssl;" por "listen 157.173.113.54:443 ssl;" e apague os
# "listen [::]:443 ssl": o tailscale serve ocupa a 443 no IP da rede privada, e o nginx não consegue escutar em todos
# os endereços ao mesmo tempo ("bind() to 0.0.0.0:443 failed (98)"). Os domínios só têm registro A (IPv4).

# Loja (Next.js, porta 3100 só no 127.0.0.1).
server {
    listen 80;
    listen [::]:80;
    server_name loja-teste.contrax.one;

    # As fotos enviadas pelo painel vão direto para a API (bloco abaixo); a loja só recebe formulários pequenos.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_mo;
    }
}

# API (.NET, porta 3101 só no 127.0.0.1). O painel envia as fotos direto para cá.
server {
    listen 80;
    listen [::]:80;
    server_name api-loja-teste.contrax.one;

    # Foto de até 15 MB (UploadProductImageCommand.MaxBytes) mais o envelope do formulário.
    client_max_body_size 17m;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A API confia nesses headers só vindos da rede do Compose (ForwardedHeaders__KnownNetworks), que é por onde o
        # nginx entra. O limite por IP de login e cadastro depende do X-Forwarded-For certo.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

map $http_upgrade $connection_upgrade_mo {
    default upgrade;
    ''      close;
}
